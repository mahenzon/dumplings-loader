<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dumplings-loader – static page via CDN</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff8ee;
        font-family: system-ui, sans-serif;
      }

      dumplings-loader {
        width: min(80vw, 360px);
      }
    </style>
  </head>
  <body>
    <!-- One script tag, no build step. Bundles Three.js (~150 KB gzipped). -->
    <dumplings-loader appearance="realistic" count="7" label="Loading"></dumplings-loader>

    <!-- Pin a version in production: https://unpkg.com/dumplings-loader@1.0.0 -->
    <script src="https://unpkg.com/dumplings-loader"></script>
    <!-- Alternatives:
         https://cdn.jsdelivr.net/npm/dumplings-loader
         https://mahenzon.github.io/dumplings-loader/dist/dumplings-loader.standalone.iife.js (latest master) -->
  </body>
</html>
