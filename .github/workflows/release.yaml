name: Release

# Publishes to npm and creates a GitHub release when a `v*` tag is pushed:
#   npm version minor && git push --follow-tags
# Auth: npm trusted publishing (OIDC, configured on npmjs.com for this repo + workflow file) is used
# by default; if an NPM_TOKEN repository secret exists it is used instead. See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm >= 11.5 (trusted publishing support)
        run: npm install -g npm@latest

      - run: npm ci

      - name: Lint, format and type check
        run: npm run lint

      - name: Build library bundles
        run: npm run build

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Pick dist-tag (prereleases go to `next`)
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      - name: Skip publish if this version is already on npm (manual first publish)
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dumplings-loader@$version" version >/dev/null 2>&1; then
            echo "already on npm: $version"; echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm (trusted publishing)
        if: env.HAS_NPM_TOKEN == 'false' && env.ALREADY_PUBLISHED == 'false'
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Publish to npm (NPM_TOKEN secret)
        if: env.HAS_NPM_TOKEN == 'true' && env.ALREADY_PUBLISHED == 'false'
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
