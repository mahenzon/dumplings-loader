name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Build library bundles
        run: npm run build

      - name: Build demo site
        run: npm run build:site
